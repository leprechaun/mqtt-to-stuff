[project]
name = "mqtt-to-stuff"
version = "0.1.0"
description = ""
authors = [
    {name = "leprechaun",email = "leprechaun@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt (>=2.1.0,<3.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "polars (>=2.0.0,<2.1.0)",
    "deltalake (>=1.1.4,<2.0.0)",
]

[project.scripts]
mqtt-to-stuff = "mqtt_to_stuff.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = ["*.nb.py"]

[dependency-groups]
dev = [
    "ruff>=0.17.0,<0.18.0",
    "marimo>=0.25.0,<0.26.0",
    "altair>=6.0.0,<7.0.0",
    "pytest>=9.2.0,<9.3.0",
]
